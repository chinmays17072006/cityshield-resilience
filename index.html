        /* Custom scrollbar for dense command center feel */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0F19;
        }
        ::-webkit-scrollbar-thumb {
            background: #1F2937;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06B6D4;
        }
        
        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.4);
        }
        .glass-panel-glow {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(6, 182, 212, 0.3);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.1);
        }
        
        .pulse-red {
            animation: pulse-red-anim 2s infinite;
        }
        @keyframes pulse-red-anim {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .pulse-cyan {
            animation: pulse-cyan-anim 2s infinite;
        }
        @keyframes pulse-cyan-anim {
            0% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.6); }
            70% { box-shadow: 0 0 0 8px rgba(6, 182, 212, 0); }
            100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
        }

        /* Google Maps command-center shell */
        .google-map-shell {
            background: #0b1220;
            position: relative;
            overflow: hidden;
        }
        .google-map-shell .leaflet-container { font-family: 'Inter', sans-serif; background: #0b1220; }
        .google-map-shell .leaflet-control-attribution { font-size: 9px; }
        .cityshield-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 9px rgba(0,0,0,.7); }
        .cityshield-dot.current { width: 14px; height: 14px; border: 3px solid #22d3ee; background: #f8fafc; }
        .cityshield-label { color: #f8fafc; font: 700 10px Inter, sans-serif; white-space: nowrap; text-shadow: 0 1px 3px #020617, 1px 0 3px #020617; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #111827; color: #e2e8f0; }
        .leaflet-popup-content { margin: 10px 12px; }
        .map-overlay {
            position: absolute;
            z-index: 2;
            pointer-events: none;
        }
        .map-overlay.is-interactive { pointer-events: auto; }
        .leaflet-tile { image-rendering: auto; }
        .leaflet-control-attribution { background: rgba(7,18,29,.84) !important; color: #94a3b8 !important; font-size: 8px !important; line-height: 1.25; max-width: min(78vw, 460px); white-space: normal !important; }
        .leaflet-control-attribution a { color: #67e8f9 !important; }

        /* CV Bounding Box Animations */
        .cv-box {
            position: absolute;
            border: 2px solid #EF4444;
            background: rgba(239, 68, 68, 0.2);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
            transition: all 0.3s ease;
        }
    </style>

            const q = query.trim().toLowerCase();
            if (!q) { target.textContent = 'Quick Suggestions: Central Hospital, Bridge B-204, Zone 4 Flood'; return; }
            const results = CITY_MARKERS.filter(item => `${item.id} ${item.title} ${item.desc}`.toLowerCase().includes(q));
            target.innerHTML = results.length ? results.map(item => `<button onclick="state.searchModalOpen=false; state.selectedMapItem=CITY_MARKERS.find(x=>x.id==='${item.id}'); setActiveTab('map');" class="block w-full text-left py-2 text-slate-300 hover:text-cyan-300">${item.id} · ${item.title}</button>`).join('') : 'No matching incidents or facilities.';
        }

        // Leaflet is loaded without an API key, so the public map is not subject to a shared Google demo quota.

        function markerColor(item) {
            if (item.severity === 'critical' || item.status === 'warning') return '#ef4444';
            if (item.status === 'healthy') return '#10b981';
            return '#22d3ee';
        }

        let cityBaseLayer = null;
        let citySatelliteLayer = null;
        let cityLabelLayer = null;
        let routeLine = null;
        let routeGeometry = null;

        function getMapCenter() { return state.mapCenter || NOVA_CITY_CENTER; }

        function mapContextMessage() {
            if (state.mapCenterMode === 'device' && state.userLocation) return 'Centered on you · Mangalore incident data is synthetic';
            if (state.mapCenterMode === 'browse') return 'Browsing this area · demo incidents remain around Mangalore';
            return 'Mangalore demo operations area · incident data is synthetic';
        }

        function headerLocationLabel() {
            if (state.mapCenterMode === 'device' && state.userLocation) return 'Your current location';
            if (state.mapCenterMode === 'browse') return 'Selected map area';
            return 'Mangalore Resilience HQ';
        }

        function locationStatusMessage() {
            if (state.locationStatus === 'requesting') return 'Finding your location…';
            if (state.userLocation) return 'CURRENT LOCATION';
            if (state.locationStatus === 'denied') return 'Location blocked · demo map';
            if (state.locationStatus === 'insecure') return 'HTTPS needed · demo map';
            if (state.locationStatus === 'unsupported') return 'Location unavailable · demo map';
            if (state.locationStatus === 'unavailable') return 'Could not locate · demo map';
            return 'Use my location · Mangalore fallback';
        }

        function refreshMapLocationText() {
            document.querySelectorAll('[data-location-status]').forEach(el => { el.textContent = locationStatusMessage(); });
            document.querySelectorAll('[data-map-context]').forEach(el => { el.textContent = mapContextMessage(); });
            document.querySelectorAll('[data-header-location]').forEach(el => { el.textContent = headerLocationLabel(); });
        }

        function drawCurrentLocation(map = googleMapInstance) {
            if (userLocationMarker) { userLocationMarker.remove(); userLocationMarker = null; }
            if (userAccuracyCircle) { userAccuracyCircle.remove(); userAccuracyCircle = null; }
            if (!map || !state.userLocation || !window.L) return;
            const point = [state.userLocation.lat, state.userLocation.lng];
            const accuracy = Math.max(25, Math.min(Number(state.userLocation.accuracy) || 80, 5000));
            userAccuracyCircle = L.circle(point, { radius: accuracy, color: '#22d3ee', opacity: .75, weight: 1, fillColor: '#22d3ee', fillOpacity: .13 }).addTo(map);
            userLocationMarker = L.marker(point, { icon: makeCityDot('#06b6d4', true), title: 'Your current location', zIndexOffset: 2000 }).addTo(map).bindPopup('Your current location (this page only)');
        }

        function makeCityDot(color, current = false) {
            return L.divIcon({ className: '', html: `<div class="cityshield-dot${current ? ' current' : ''}" style="${current ? '' : `background:${color}`}" ></div>`, iconSize: current ? [14, 14] : [16, 16], iconAnchor: current ? [7, 7] : [8, 8] });
        }

        function mapMarkerLayerEnabled(item) {
            if (item.type === 'incident') return state.mapLayers.risk && state.mapLayers.incidents;
            if (item.type === 'infra') return state.mapLayers.infrastructure;
            if (item.type === 'service') return state.mapLayers.services;
            if (item.type === 'report') return state.mapLayers.reports;
            return true;
        }

        function initGoogleMap() {
            const container = document.getElementById('gisMap') || document.getElementById('landingMap');
            if (!container || !window.L) return;
            const isLanding = container.id === 'landingMap';
            if (googleMapInstance && googleMapInstance.getContainer && googleMapInstance.getContainer() === container) {
                const existingMap = googleMapInstance;
                setTimeout(() => { if (googleMapInstance === existingMap) existingMap.invalidateSize(); }, 100);
                return;
            }
            if (routeLine) { routeLine.remove(); routeLine = null; }
            clearWeatherOverlay();
            clearAqiOverlay();
            if (radarMapType) { radarMapType.remove(); radarMapType = null; }
            if (googleMapInstance && googleMapInstance.remove) googleMapInstance.remove();
            googleMapMarkers = [];
            responderMarkers = [];
            const center = state.mapView?.center || state.mapCenter || NOVA_CITY_CENTER;
            const zoom = state.mapView?.zoom ?? (isLanding ? 12 : 13);
            const map = L.map(container, { zoomControl: false, attributionControl: true, preferCanvas: true, minZoom: 3, maxZoom: 19 }).setView(center, zoom);
            googleMapInstance = map;
            map.on('moveend', () => {
                if (googleMapInstance !== map) return;
                const c = map.getCenter();
                state.mapView = { center: [c.lat, c.lng], zoom: map.getZoom() };
                state.mapCenter = [c.lat, c.lng];
                const deviceDistance = state.userLocation ? map.distance(c, [state.userLocation.lat, state.userLocation.lng]) : Infinity;
                const demoDistance = map.distance(c, NOVA_CITY_CENTER);
                state.mapCenterMode = deviceDistance < 800 ? 'device' : demoDistance < 1800 ? 'demo' : 'browse';
                refreshMapLocationText();
            });
            container.dataset.mapReady = 'true';
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            const maxNativeZoom = 17;
            cityBaseLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                maxNativeZoom, maxZoom: 19, keepBuffer: 2,
                attribution: 'Sources: Esri, HERE, Garmin, USGS, Intermap, INCREMENT P, NRCan, Esri Japan, METI, Esri China (Hong Kong), Esri Korea, Esri (Thailand), NGCC, &copy; OpenStreetMap contributors, and the GIS User Community'
            });
            citySatelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxNativeZoom, maxZoom: 19, keepBuffer: 2,
                attribution: 'Imagery: Esri, Vantor, Earthstar Geographics, and the GIS User Community'
            });
            const referenceAttribution = 'Labels and roads: Esri, HERE, Garmin, &copy; OpenStreetMap contributors, and the GIS user community';
            const placesLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom, maxZoom: 19, opacity: .96, keepBuffer: 2, attribution: referenceAttribution });
            const roadLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom, maxZoom: 19, opacity: .94, keepBuffer: 2, attribution: referenceAttribution });
            cityLabelLayer = L.layerGroup([placesLabels, roadLabels]);
            if (state.mapType === 'hybrid') { citySatelliteLayer.addTo(map); cityLabelLayer.addTo(map); }
            else cityBaseLayer.addTo(map);

            L.marker(NOVA_CITY_CENTER, { icon: makeCityDot('#f8fafc', true), zIndexOffset: 1000, title: 'Mangalore Resilience HQ' }).addTo(map).bindPopup('<b>Mangalore Resilience HQ</b><br>Synthetic demo command-center location');
            if (!isLanding) {
                if (state.mapLayers.flood || state.simulation.active) {
                    L.polygon([[12.9080,74.8480],[12.9250,74.8500],[12.9280,74.8700],[12.9050,74.8720]], {
                        color: state.simulation.active ? getSimulationScenario().color : '#22d3ee', weight: 2, fillColor: state.simulation.active ? getSimulationScenario().color : '#22d3ee', fillOpacity: state.simulation.active ? .35 : .2
                    }).addTo(map).bindPopup(state.simulation.active ? `Illustrative ${getSimulationScenario().name} impact area` : 'Illustrative flood-risk zone · demo data');
                }
                CITY_MARKERS.filter(mapMarkerLayerEnabled).forEach(item => {
                    const marker = L.marker([item.lat, item.lng], { icon: makeCityDot(markerColor(item)), title: item.title }).addTo(map);
                    marker.bindPopup(`<b>${item.title}</b><br>${item.id} · ${item.severity || item.status || item.type}<br>${item.desc}`);
                    marker.on('click', () => { state.selectedMapItem = item; renderApp(); });
                    googleMapMarkers.push(marker);
                });
                state.simulatedMapAlerts.forEach(alert => {
                    const marker = L.marker([alert.position.lat, alert.position.lng], { icon: makeCityDot('#f97316'), title: alert.title }).addTo(map).bindPopup(`<b>${alert.title}</b><br>${alert.detail}`);
                    googleMapMarkers.push(marker);
                });
                responderMarkers = state.responders.map(unit => {
                    const marker = L.marker([unit.lat, unit.lng], { icon: makeCityDot(unit.color), title: `${unit.id} · ${unit.name}` });
                    marker.bindPopup(`${unit.id} · ${unit.name}<br>${unit.status}`);
                    if (state.responderTrackingEnabled) marker.addTo(map);
                    return marker;
                });
            } else if (!state.userLocation) {
                const focal = CITY_MARKERS[0];
                L.marker([focal.lat, focal.lng], { icon: makeCityDot('#ef4444'), title: focal.title }).addTo(map).bindPopup(`<b>${focal.title}</b><br>${focal.desc}`);
                L.circle([focal.lat, focal.lng], { radius: 1200, color: '#22d3ee', weight: 1, opacity: .45, fillColor: '#22d3ee', fillOpacity: .08 }).addTo(map);
            }
            drawCurrentLocation(map);
            renderWeatherOverlay();
            renderAqiOverlay();
            if (state.radarEnabled) addRadarLayer();
            if (routeGeometry && !isLanding) routeLine = L.geoJSON(routeGeometry, { style: { color: '#f97316', weight: 5, opacity: .9 } }).addTo(map);
            refreshMapLocationText();
            setTimeout(() => { if (googleMapInstance === map) map.invalidateSize(); }, 120);
        }

        function centerMapOnDemo() {
            const center = [NOVA_CITY_CENTER[0], NOVA_CITY_CENTER[1]];
            const zoom = 13;
            state.mapCenter = center;
            state.mapCenterMode = 'demo';
            state.mapView = { center, zoom };
            if (googleMapInstance) googleMapInstance.setView(center, zoom);
            refreshMapLocationText();
        }

        function requestCurrentLocation(quiet = false) {
            if (!navigator.geolocation) {
                state.locationStatus = 'unsupported'; refreshMapLocationText();
                if (!quiet) alert('This browser does not provide device location. The Mangalore demo map is still available.');
                return;
            }
            if (!window.isSecureContext) {
                state.locationStatus = 'insecure'; refreshMapLocationText();
                if (!quiet) alert('For device location, open this page over HTTPS or localhost. The Mangalore demo map is still available.');
                return;
            }
            state.locationStatus = 'requesting'; refreshMapLocationText();
            navigator.geolocation.getCurrentPosition(position => {
                const point = [position.coords.latitude, position.coords.longitude];
                state.userLocation = { lat: point[0], lng: point[1], accuracy: position.coords.accuracy || 80 };
                state.mapCenter = point;
                state.mapCenterMode = 'device';
                const zoom = Math.max(15, googleMapInstance?.getZoom?.() || 15);
                state.mapView = { center: point, zoom: Math.min(zoom, 19) };
                if (googleMapInstance) {
                    googleMapInstance.setView(point, state.mapView.zoom);
                    drawCurrentLocation(googleMapInstance);
                }
                state.locationStatus = 'located';
                refreshMapLocationText();
            }, error => {
                state.locationStatus = error?.code === 1 ? 'denied' : 'unavailable';
                refreshMapLocationText();
                if (!quiet) alert(error?.code === 1 ? 'Location access was denied. You can enable it in your browser settings or continue with the Mangalore demo map.' : 'Could not determine your location. The Mangalore demo map is still available.');
            }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 300000 });
        }

        function locateUser() { requestCurrentLocation(false); }

        function toggleResponderTracking() {
            state.responderTrackingEnabled = !state.responderTrackingEnabled;
            responderMarkers.forEach(marker => {
                if (state.responderTrackingEnabled) marker.addTo(googleMapInstance);
                else marker.remove();
            });
            renderApp();
        }

        function updateResponderPositions() {
            state.responders.forEach((unit, index) => {
                unit.lat += (Math.random() - .5) * .0015;
                unit.lng += (Math.random() - .5) * .0015;
                const marker = responderMarkers[index];
                if (marker) {
                    marker.setLatLng([unit.lat, unit.lng]);
                    if (state.responderTrackingEnabled && googleMapInstance && !googleMapInstance.hasLayer(marker)) marker.addTo(googleMapInstance);
                    if (!state.responderTrackingEnabled && googleMapInstance && googleMapInstance.hasLayer(marker)) marker.remove();
                }
            });
        }

        function dispatchResource(id) {
            const resource = state.resourceInventory.find(item => item.id === id);
            if (!resource || resource.available < 1) { alert('No available units of this type.'); return; }
            resource.available -= 1; resource.deployed += 1;
            state.activeNotifications.unshift({ id: Date.now(), title: `${resource.label} dispatched`, detail: `${resource.deployed} deployed · ${resource.available} available`, time: 'just now', priority: 'high' });
            state.activeNotifications = state.activeNotifications.slice(0, 8);
            speakAlert(`${resource.label} dispatched to the active incident.`);
            renderApp();
        }

        function recallResource(id) {
            const resource = state.resourceInventory.find(item => item.id === id);
            if (!resource || resource.deployed < 1) return;
            resource.available += 1; resource.deployed -= 1;
            renderApp();
        }

        function routePoint(id) {
            if (id === 'current-location') {
                const p = state.userLocation || { lat: getMapCenter()[0], lng: getMapCenter()[1] };
                return { lat: p.lat, lng: p.lng };
            }
            if (id === 'mangalore-hq') return { lat: NOVA_CITY_CENTER[0], lng: NOVA_CITY_CENTER[1] };
            const item = CITY_MARKERS.find(marker => marker.id === id);
            return item ? { lat: item.lat, lng: item.lng } : { lat: NOVA_CITY_CENTER[0], lng: NOVA_CITY_CENTER[1] };
        }

        async function calculateDispatchRoute() {
            if (!googleMapInstance) { alert('Open the live map before calculating a dispatch route.'); return; }
            const origin = routePoint(state.routeOrigin);
            const destination = routePoint(state.routeDestination);
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${origin.lng},${origin.lat};${destination.lng},${destination.lat}?overview=full&geometries=geojson`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Route service unavailable');
                const data = await response.json();
                const route = data.routes && data.routes[0];
                if (!route) throw new Error('No route found');
                if (routeLine) routeLine.remove();
                routeGeometry = route.geometry;
                routeLine = L.geoJSON(routeGeometry, { style: { color: '#f97316', weight: 5, opacity: .9 } }).addTo(googleMapInstance);
                googleMapInstance.fitBounds(routeLine.getBounds(), { padding: [35, 35], maxZoom: 16 });
                const duration = `${Math.max(1, Math.round(route.duration / 60))} min`;
                const distance = route.distance >= 1000 ? `${(route.distance / 1000).toFixed(1)} km` : `${Math.round(route.distance)} m`;
                state.activeNotifications.unshift({ id: Date.now(), title: 'Dispatch Route Calculated', detail: `Fastest route · ${duration} · ${distance}`, time: 'just now', priority: 'normal' });
                state.activeNotifications = state.activeNotifications.slice(0, 8);
                speakAlert('Dispatch route calculated. Estimated response time ' + duration);
                renderApp();
            } catch (error) {
                alert('Fastest dispatch route is temporarily unavailable. Please try again.');
            }
        }

        let radarMapType = null;
        let radarTileTemplatePromise = null;
        let aqiShapes = [];
        let aqiLabels = [];

        function toggleRadarLayer() {
            state.radarEnabled = !state.radarEnabled;
            renderApp();
        }

        async function addRadarLayer() {
            const targetMap = googleMapInstance;
            if (!targetMap || !state.radarEnabled) return;
            try {
                if (!radarTileTemplatePromise) {
                    radarTileTemplatePromise = fetch('https://api.rainviewer.com/public/weather-maps.json').then(response => {
                        if (!response.ok) throw new Error('Radar service unavailable');
                        return response.json();
                    }).then(data => {
                        const frames = data.radar?.past || [];
                        const latest = frames[frames.length - 1];
                        if (!latest) throw new Error('No radar frame');
                        return `https://tilecache.rainviewer.com${latest.path}/256/{z}/{x}/{y}/2/1_1.png`;
                    }).catch(error => { radarTileTemplatePromise = null; throw error; });
                }
                const url = await radarTileTemplatePromise;
                if (targetMap !== googleMapInstance || !state.radarEnabled) return;
                if (radarMapType) radarMapType.remove();
                radarMapType = L.tileLayer(url, { opacity: .58, maxNativeZoom: 10, maxZoom: 19, attribution: 'Weather radar &copy; RainViewer' }).addTo(targetMap);
            } catch (error) {
                state.radarEnabled = false;
                if (!state.isLandingView && state.authenticated) renderApp();
            }
        }

        function clearAqiOverlay() {
            aqiShapes.forEach(shape => shape.remove());
            aqiLabels.forEach(label => label.remove());
            aqiShapes = [];
            aqiLabels = [];
        }

        function renderAqiOverlay() {
            clearAqiOverlay();
            if (!state.aqiEnabled || !googleMapInstance || !window.L) return;
            const value = Number(state.aqi.value);
            const color = value > 150 ? '#ef4444' : value > 100 ? '#f59e0b' : value > 50 ? '#facc15' : '#22c55e';
            aqiShapes.push(L.circle(NOVA_CITY_CENTER, { radius: 2600, color, opacity: .65, weight: 2, fillColor: color, fillOpacity: .12 }).addTo(googleMapInstance));
            aqiLabels.push(L.marker([NOVA_CITY_CENTER[0] + .012, NOVA_CITY_CENTER[1] + .012], { icon: L.divIcon({ className: 'cityshield-label', html: `AQI ${state.aqi.value} · ${state.aqi.label}`, iconSize: [145, 18] }), interactive: false }).addTo(googleMapInstance));
        }

        function toggleAqiOverlay() {
            state.aqiEnabled = !state.aqiEnabled;
            renderAqiOverlay();
            renderApp();
        }

        async function fetchAirQualityData() {
            const [lat, lng] = NOVA_CITY_CENTER;
            try {
                const response = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lng}&current=us_aqi,pm2_5,pm10,ozone&timezone=auto`);
                if (!response.ok) throw new Error('AQI feed unavailable');
                const data = await response.json();
                const current = data.current || {};
                const value = Math.round(Number(current.us_aqi ?? 0));
                state.aqi = { loading: false, value, label: value > 150 ? 'Unhealthy' : value > 100 ? 'Sensitive groups' : value > 50 ? 'Moderate' : 'Good', updated: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
                renderAqiOverlay();
                if (!state.isLandingView) renderApp();
            } catch (error) {
                state.aqi = { loading: false, value: '--', label: 'AQI unavailable', updated: 'Retrying' };
                if (!state.isLandingView) renderApp();
            }
        }

        function locateUser() {
            if (!navigator.geolocation) {
                alert('Location services are not supported by this browser.');
                return;
            }
            if (!googleMapInstance) {
                setActiveTab('map');
                setTimeout(locateUser, 500);
                return;
            }
            navigator.geolocation.getCurrentPosition(position => {
                const point = [position.coords.latitude, position.coords.longitude];
                googleMapInstance.setView(point, 15);
                if (userLocationMarker) userLocationMarker.remove();
                if (userAccuracyCircle) userAccuracyCircle.remove();
                userLocationMarker = L.marker(point, { icon: makeCityDot('#06b6d4', true), title: 'Your current location' }).addTo(googleMapInstance).bindPopup('Your current location');
                userAccuracyCircle = L.circle(point, { radius: position.coords.accuracy || 80, color: '#22d3ee', opacity: .7, weight: 1, fillColor: '#22d3ee', fillOpacity: .12 }).addTo(googleMapInstance);
            }, () => alert('Location permission was denied or unavailable. Please allow location access and try again.'), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
        }

        let weatherOverlayShapes = [];
        let weatherOverlayLabels = [];

        function clearWeatherOverlay() {
            weatherOverlayShapes.forEach(shape => shape.remove());
            weatherOverlayLabels.forEach(label => label.remove());
            weatherOverlayShapes = [];
            weatherOverlayLabels = [];
        }

        function renderWeatherOverlay() {
            clearWeatherOverlay();
            if (!state.weatherOverlay || !googleMapInstance || !window.L) return;
            const rain = Number(state.weather.precipitation || 0);
            const temp = Number(state.weather.temp || 20);
            const zones = [
                { lat: 12.914, lng: 74.856, radius: 1500, color: rain > 60 ? '#38bdf8' : '#22d3ee', label: rain > 60 ? 'Heavy rain risk' : 'Rain watch' },
                { lat: 12.927, lng: 74.867, radius: 1100, color: temp > 30 ? '#fb923c' : '#60a5fa', label: temp > 30 ? 'Heat stress watch' : 'Cool air pocket' },
                { lat: 12.900, lng: 74.848, radius: 900, color: '#a78bfa', label: 'Wind corridor' }
            ];
            zones.forEach(zone => {
                weatherOverlayShapes.push(L.circle([zone.lat, zone.lng], { radius: zone.radius, color: zone.color, opacity: .55, weight: 1, fillColor: zone.color, fillOpacity: .13 }).addTo(googleMapInstance));
                weatherOverlayLabels.push(L.marker([zone.lat, zone.lng], { icon: L.divIcon({ className: 'cityshield-label', html: zone.label, iconSize: [130, 18] }), interactive: false }).addTo(googleMapInstance));
            });
        }

        function toggleMapType() {
            state.mapType = state.mapType === 'hybrid' ? 'roadmap' : 'hybrid';
            if (googleMapInstance && cityBaseLayer && citySatelliteLayer && cityLabelLayer) {
                if (state.mapType === 'hybrid') {
                    googleMapInstance.removeLayer(cityBaseLayer);
                    citySatelliteLayer.addTo(googleMapInstance);
                    cityLabelLayer.addTo(googleMapInstance);
                } else {
                    googleMapInstance.removeLayer(citySatelliteLayer);
                    googleMapInstance.removeLayer(cityLabelLayer);
                    cityBaseLayer.addTo(googleMapInstance);
                }
            }
            renderApp();
        }

        function toggleWeatherOverlay() {
            state.weatherOverlay = !state.weatherOverlay;
            renderWeatherOverlay();
            renderApp();
        }

        async function fetchWeatherData() {
            const [lat, lng] = NOVA_CITY_CENTER;
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,precipitation,rain,wind_speed_10m,weather_code&hourly=precipitation_probability&timezone=auto&forecast_days=1`);
                if (!response.ok) throw new Error('Weather feed unavailable');
                const data = await response.json();
                const current = data.current || {};
                const code = Number(current.weather_code || 0);
                const descriptions = { 0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast', 45: 'Fog', 48: 'Rime fog', 51: 'Light drizzle', 53: 'Drizzle', 61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 80: 'Rain showers', 81: 'Rain showers', 82: 'Heavy rain showers', 95: 'Thunderstorm' };
                const probability = data.hourly?.precipitation_probability?.[0] ?? Math.round(Number(current.precipitation || 0) * 10);
                state.weather = { loading: false, temp: Math.round(Number(current.temperature_2m ?? 0)), wind: Math.round(Number(current.wind_speed_10m ?? 0)), precipitation: probability, description: descriptions[code] || 'Live conditions', updated: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
                renderWeatherOverlay();
                if (!state.isLandingView) renderApp();
            } catch (error) {
                state.weather.loading = false;
                state.weather.description = 'Weather feed unavailable';
                state.weather.updated = 'Retrying';
                if (!state.isLandingView) renderApp();
            }
        }

        const VOICE_LANGUAGE_OPTIONS = { en: 'en-US', hi: 'hi-IN', kn: 'kn-IN', bn: 'bn-IN', es: 'es-ES', fr: 'fr-FR', de: 'de-DE', pt: 'pt-BR', ar: 'ar-SA', zh: 'zh-CN', ja: 'ja-JP' };

        function speakAlert(text) {
            if (!state.voiceAlertsEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = state.voiceAlertLanguage;
            utterance.rate = .95;
            utterance.pitch = 1;
            window.speechSynthesis.speak(utterance);
        }

        function setVoiceAlertLanguage(lang) {
            state.voiceAlertLanguage = VOICE_LANGUAGE_OPTIONS[lang] || lang;

        function submitCitizenReport() {
            const draft = state.reportDraft;
            if (!draft.description.trim()) { alert('Please describe the issue before submitting.'); return; }
            if (!draft.location) { alert('Capture the report location first so responders receive the correct coordinates.'); return; }
            const point = draft.location;
            const id = 'CS-' + Math.floor(10000 + Math.random() * 89999);
            const report = { id, type: 'report', title: `${draft.category} citizen report`, lat: point.lat, lng: point.lng, status: 'new', severity: draft.category === 'Medical emergency' || draft.category === 'Fire' ? 'critical' : 'elevated', desc: draft.description, factors: ['Citizen-submitted', draft.photoName ? 'Photo evidence attached' : 'No photo attached'], confidence: draft.photoName ? 78 : 62 };
            CITY_MARKERS.push(report);
            state.submittedReports.unshift({ ...report, time: 'just now', photoName: draft.photoName, locationLabel: draft.locationLabel });
            state.fusedReports.unshift({ id, cat: draft.category, loc: draft.locationLabel, time: 'Just now', desc: draft.description, simScore: report.confidence });
            state.activeNotifications.unshift({ id: Date.now(), title: 'New citizen report received', detail: `${id} · ${draft.category} · ${draft.locationLabel}`, time: 'just now', priority: report.severity === 'critical' ? 'high' : 'medium' });
            state.activeNotifications = state.activeNotifications.slice(0, 8);
            speakAlert(`New citizen report. ${draft.category}. ${draft.description}`);
            state.reportDraft = { category: 'Flooding', description: '', location: null, locationLabel: 'Location not captured', photoName: '' };
            renderApp();
        }

        function renderLandingPage() {
            return `
                <div class="min-h-screen bg-[#07121d] text-slate-100 relative overflow-hidden flex flex-col">
                    <div class="absolute inset-0 pointer-events-none opacity-70" style="background: radial-gradient(circle at 78% 49%, rgba(22, 104, 135, .18), transparent 32%), linear-gradient(120deg, transparent 0 55%, rgba(34, 211, 238, .035) 55% 55.2%, transparent 55.2%);"></div>

                        <div class="flex items-center gap-5 text-[10px] font-mono tracking-[0.14em] text-slate-400"><span class="hidden sm:flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-amber-400"></span>DEMO ENVIRONMENT</span><span class="hidden sm:inline text-slate-700">|</span><span class="hidden md:inline">NOVA CITY</span><button onclick="openRoleChooser('overview')" class="border border-slate-700/80 px-3 py-2 text-slate-200 hover:border-cyan-300 hover:text-cyan-200 transition">Open console <i class="fa-solid fa-arrow-up-right-from-square ml-1"></i></button></div>
                    </header>
                    <main class="relative z-10 flex-1 max-w-[1280px] mx-auto w-full px-6 lg:px-10 pt-8 lg:pt-12 pb-10">
                        <div class="grid lg:grid-cols-[.9fr_1.1fr] gap-12 lg:gap-16 items-center">
                            <section class="max-w-[570px]">
                                <div class="flex items-center gap-3 text-[10px] font-mono tracking-[0.3em] text-slate-400 mb-7"><span class="w-9 h-px bg-cyan-300"></span>URBAN RESILIENCE INTELLIGENCE<span class="w-9 h-px bg-cyan-300"></span></div>
                                <h1 class="text-[clamp(3.5rem,7vw,6.2rem)] leading-[.88] font-semibold tracking-[-0.07em]">CityShield<br><span class="text-cyan-300">Resilience</span></h1>
                                <p class="mt-7 text-xl font-mono text-slate-200 tracking-wide">Predict. Protect. Respond. Recover.</p>

                                <div class="mt-7 flex items-center gap-2 text-[10px] font-mono text-slate-500"><i class="fa-solid fa-shield-heart text-emerald-400"></i>Evidence-first AI <span>•</span> Human review before consequential action <span>•</span> Synthetic incident data</div>
                            </section>
                            <section class="relative">
                                <div class="absolute -inset-5 border border-cyan-200/10 rotate-[-3deg] pointer-events-none"></div>
                                <div class="border border-slate-700/80 bg-[#0a1723]/90 p-3 shadow-2xl shadow-cyan-950/20">
                                    <div class="flex items-center justify-between px-2 py-1.5 text-[9px] font-mono tracking-[0.18em] text-slate-400"><span class="flex items-center gap-2 text-cyan-200"><span class="w-2 h-2 rounded-full bg-cyan-300 animate-pulse"></span>LIVE CITY RISK LAYER</span><span>PLACES · ROADS · SYNTHETIC INCIDENTS</span></div>
                                    <div class="relative google-map-shell border border-slate-700/80 h-[320px] sm:h-[390px]">

                                        <div class="map-overlay top-3 left-3 bg-[#07121d]/90 border border-cyan-300/40 px-2 py-1.5 text-[9px] font-mono text-cyan-100"><i class="fa-solid fa-location-dot mr-1"></i><span data-location-status>Requesting location permission…</span></div>
                                        <button onclick="toggleMapType()" class="map-overlay is-interactive top-3 right-3 bg-[#07121d]/90 border border-slate-700 px-2.5 py-1.5 text-[10px] text-slate-100 hover:border-cyan-300"><i class="fa-solid fa-layer-group mr-1"></i>${state.mapType === 'hybrid' ? 'Road map' : 'Satellite'}</button>
                                        <button onclick="locateUser()" class="map-overlay is-interactive bottom-3 right-3 bg-[#07121d]/90 border border-cyan-300/40 px-2.5 py-1.5 text-[10px] text-cyan-100 hover:bg-cyan-950/90"><i class="fa-solid fa-location-crosshairs mr-1"></i>My location</button>

                                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 px-2 pt-2 text-[8px] font-mono tracking-[0.08em] text-slate-500"><span>LABELS ADJUST WITH ZOOM · Esri / OSM DATA</span><span data-map-context>${mapContextMessage()}</span></div>
                                </div>
                                <p class="mt-3 text-[9px] leading-4 text-slate-500">Location permission is optional. Coordinates are used for centering; Esri receives tile requests for the visible area. If you request a route, its selected endpoints are sent to the public routing service.</p>

                        </div>
                        <div class="grid md:grid-cols-3 gap-8 mt-12 lg:mt-16 pt-6 border-t border-slate-800/80"><div class="flex gap-4"><span class="text-[10px] font-mono text-cyan-300">01</span><div><h3 class="text-xs font-bold text-slate-200">Risk intelligence</h3><p class="text-[11px] text-slate-500 mt-1">See what changed, why it matters, and where.</p></div></div><div class="flex gap-4"><span class="text-[10px] font-mono text-cyan-300">02</span><div><h3 class="text-xs font-bold text-slate-200">Evidence-first AI</h3><p class="text-[11px] text-slate-500 mt-1">Every recommendation is traceable and reviewable.</p></div></div><div class="flex gap-4"><span class="text-[10px] font-mono text-cyan-300">03</span><div><h3 class="text-xs font-bold text-slate-200">Resilience simulation</h3><p class="text-[11px] text-slate-500 mt-1">Pressure-test the city before the next event.</p></div></div></div>

                </div>
            `;

        function renderNotificationsDrawer() {
            if (!state.notificationsOpen) return '';
            return `
                <div class="fixed inset-y-0 right-0 w-80 bg-navy-900 border-l border-slate-800 z-50 p-4 shadow-2xl flex flex-col justify-between">

                        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                            <div><h3 class="text-sm font-bold text-slate-100">Live Notifications</h3><div class="text-[9px] font-mono text-emerald-400 mt-1"><span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1 animate-pulse"></span>SIMULATED LIVE FEED</div></div>
                            <button onclick="exportAlertLogsCsv()" class="text-[10px] text-cyan-300 hover:text-cyan-100 mr-3">CSV</button><button onclick="toggleVoiceAlerts()" class="text-[10px] text-cyan-300 hover:text-cyan-100 mr-3"><i class="fa-solid ${state.voiceAlertsEnabled ? 'fa-volume-high' : 'fa-volume-xmark'}"></i></button><button onclick="state.activeNotifications = []; state.notificationsOpen = false; renderApp();" class="text-[10px] text-slate-500 hover:text-slate-200 mr-3">Clear</button><button onclick="state.notificationsOpen = false; renderApp();" class="text-slate-500 hover:text-slate-200">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div class="space-y-2">

                                <div class="p-2.5 bg-navy-950 rounded-lg border border-slate-800 space-y-1">
                                    <div class="flex items-center justify-between text-xs">
                                        <span class="font-bold text-slate-200">${n.title}</span>
                                        <span class="text-[10px] text-slate-500">${n.time}</span>
                                    </div>
                                    <p class="text-[11px] text-slate-400">${n.detail}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSearchModal() {
            if (!state.searchModalOpen) return '';
            return `
                <div class="fixed inset-0 bg-navy-950/80 backdrop-blur-sm z-50 flex items-start justify-center pt-20 p-4">
                    <div class="bg-navy-900 border border-slate-700 rounded-xl w-full max-w-xl p-4 shadow-2xl space-y-4">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                            <input id="globalSearchInput" type="text" oninput="runGlobalSearch(this.value)" placeholder="Search incidents, infrastructure, facilities..." class="bg-transparent border-none text-slate-100 w-full focus:outline-none text-sm" autofocus />
                            <button onclick="state.searchModalOpen = false; renderApp();" class="text-slate-500">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div id="searchResults" class="text-xs text-slate-500 font-mono">Quick Suggestions: Central Hospital, Bridge B-204, Zone 4 Flood</div>
                    </div>
                </div>
            `;
        }

        function approveAction(id) {
            state.auditLogs.unshift({
                id: 'AUD-' + Math.floor(1000 + Math.random() * 9000),
                time: new Date().toISOString().substring(11, 19) + ' UTC',
                event: 'Action Approved for Item ' + id,
                actor: 'Operations Administrator',
                status: 'EXECUTED',
                impact: 'Resource dispatched successfully'
            });
            alert("Action for " + id + " approved and logged into Audit Trail!");
            renderApp();
        }

        document.addEventListener('keydown', event => {
            if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
                event.preventDefault();
                if (state.authenticated) { state.searchModalOpen = true; renderApp(); setTimeout(() => document.getElementById('globalSearchInput')?.focus(), 30); }
            }
            if (event.key === 'Escape') {
                let changed = false;
                if (state.searchModalOpen) { state.searchModalOpen = false; changed = true; }
                if (state.notificationsOpen) { state.notificationsOpen = false; changed = true; }
                if (changed) renderApp();
            }
        });

        // Initialize application on load
        window.onload = function() {
            renderApp();
            startLiveFeeds();
            setTimeout(() => { if (!window.L) showMapFallback(); }, 4500);
        };
    </script>
